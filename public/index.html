<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>minimi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
  <link rel="stylesheet" href="/app.css">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try { const t = localStorage.getItem("minimi-theme"); if (t === "latte" || t === "mocha") document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="side-head">
        <span class="brand"><span class="brand-mark" aria-hidden="true"></span>minimi</span>
      </div>
      <button class="new" id="new-session" type="button">New conversation</button>
      <nav class="sessions" id="sessions"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>
    <section class="main">
      <header class="top">
        <button class="icon-btn menu" id="menu" type="button" aria-label="Show conversations">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <span class="today" id="today"></span>
        <span class="model" id="model"></span>
        <button class="icon-btn theme" id="theme" type="button" aria-label="Switch theme"></button>
      </header>
      <div class="scroll" id="scroll">
        <div class="thread" id="thread"></div>
      </div>
      <form class="composer" id="composer">
        <label class="sr-only" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Ask anything…" autocomplete="off"></textarea>
        <button id="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </section>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
